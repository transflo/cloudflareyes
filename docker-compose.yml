services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai

  cf-dns-updater:
    build: .
    container_name: cf-dns-updater
    restart: unless-stopped
    depends_on:
      - flaresolverr
    env_file:
      - .env
    environment:
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
      - TARGET_URL=${TARGET_URL:-https://api.uouin.com/cloudflare.html}
    # 可选: 先跑一次验证, 再改成定时循环
    # command: ["python", "app.py"]
