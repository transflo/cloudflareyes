services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai
    healthcheck:
      # 端口真正开始监听后才算健康，避免更新器提前请求导致 Connection refused
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 8191), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  cf-dns-updater:
    # 两种部署方式：
    #   1) 本地构建：docker compose up -d --build
    #   2) Docker Hub 镜像：在 .env 中设置 DOCKER_IMAGE=<DockerHub用户名>/cloudflareyes:latest，
    #      然后 docker compose pull && docker compose up -d（或删除 build: . 行直接拉取）
    image: ${DOCKER_IMAGE:-transflo/cloudflareyes:latest}
    build: .
    container_name: cf-dns-updater
    restart: unless-stopped
    depends_on:
      flaresolverr:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://flaresolverr:8191}
      - TARGET_URL=${TARGET_URL:-https://api.uouin.com/cloudflare.html}
    # 可选: 先跑一次验证, 再改成定时循环
    # - RUN_ONCE=true
    # - DRY_RUN=true
